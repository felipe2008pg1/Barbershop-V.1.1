<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 10" width="1200" height="10" preserveAspectRatio="none" role="presentation" aria-hidden="true" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="s" width="45" height="10" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="45 0" dur="3s" repeatCount="indefinite"/>
        <rect x="-45" width="15" height="10" fill="#E63946"/>
        <rect x="-30" width="15" height="10" fill="#F8F9FA"/>
        <rect x="-15" width="15" height="10" fill="#1D5FD1"/>
        <rect x="0" width="15" height="10" fill="#E63946"/>
        <rect x="15" width="15" height="10" fill="#F8F9FA"/>
        <rect x="30" width="15" height="10" fill="#1D5FD1"/>
        <rect x="45" width="15" height="10" fill="#E63946"/>
        <rect x="60" width="15" height="10" fill="#F8F9FA"/>
        <rect x="75" width="15" height="10" fill="#1D5FD1"/>
      </g>
    </pattern>
    <clipPath id="c"><rect width="1200" height="10" rx="5"/></clipPath>
  </defs>
  <g clip-path="url(#c)"><rect width="1200" height="10" fill="url(#s)"/></g>
</svg>
