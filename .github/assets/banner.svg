<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="Barbershop V1.1 — Remastered" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Barbershop V1.1 — Remastered</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1320"/>
      <stop offset="1" stop-color="#14213D"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity=".05"/>
      <stop offset=".3" stop-color="#fff" stop-opacity=".45"/>
      <stop offset=".55" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#000" stop-opacity=".35"/>
    </linearGradient>
    <linearGradient id="cap" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7C8798"/>
      <stop offset=".4" stop-color="#E5E9F0"/>
      <stop offset="1" stop-color="#5B6577"/>
    </linearGradient>
    <pattern id="pole" width="60" height="60" patternUnits="userSpaceOnUse" patternTransform="rotate(-38)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="0 60" dur="1.6s" repeatCount="indefinite"/>
        <rect x="0" y="-60" width="80" height="20" fill="#E63946"/>
        <rect x="0" y="-40" width="80" height="20" fill="#F8F9FA"/>
        <rect x="0" y="-20" width="80" height="20" fill="#1D5FD1"/>
        <rect x="0" y="0" width="80" height="20" fill="#E63946"/>
        <rect x="0" y="20" width="80" height="20" fill="#F8F9FA"/>
        <rect x="0" y="40" width="80" height="20" fill="#1D5FD1"/>
        <rect x="0" y="60" width="80" height="20" fill="#E63946"/>
        <rect x="0" y="80" width="80" height="20" fill="#F8F9FA"/>
        <rect x="0" y="100" width="80" height="20" fill="#1D5FD1"/>
      </g>
    </pattern>
    <pattern id="band" width="60" height="20" patternUnits="userSpaceOnUse" patternTransform="skewX(-35)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="60 0" dur="2.4s" repeatCount="indefinite"/>
        <rect x="-60" y="0" width="20" height="20" fill="#E63946"/>
        <rect x="-40" y="0" width="20" height="20" fill="#F8F9FA"/>
        <rect x="-20" y="0" width="20" height="20" fill="#1D5FD1"/>
        <rect x="0" y="0" width="20" height="20" fill="#E63946"/>
        <rect x="20" y="0" width="20" height="20" fill="#F8F9FA"/>
        <rect x="40" y="0" width="20" height="20" fill="#1D5FD1"/>
        <rect x="60" y="0" width="20" height="20" fill="#E63946"/>
        <rect x="80" y="0" width="20" height="20" fill="#F8F9FA"/>
        <rect x="100" y="0" width="20" height="20" fill="#1D5FD1"/>
      </g>
    </pattern>
    <clipPath id="card"><rect width="1200" height="320" rx="26"/></clipPath>
    <clipPath id="body"><rect x="96" y="62" width="64" height="196" rx="8"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <circle cx="1040" cy="150" r="190" fill="#E63946" opacity=".05"/>
    <circle cx="140" cy="160" r="150" fill="#1D5FD1" opacity=".07"/>
    <rect y="300" width="1200" height="20" fill="url(#band)"/>
  </g>

  <!-- Barber pole -->
  <rect x="92" y="36" width="72" height="30" rx="10" fill="url(#cap)"/>
  <rect x="92" y="254" width="72" height="30" rx="10" fill="url(#cap)"/>
  <g clip-path="url(#body)">
    <rect x="96" y="62" width="64" height="196" fill="url(#pole)"/>
    <rect x="96" y="62" width="64" height="196" fill="url(#glass)"/>
  </g>
  <rect x="96" y="62" width="64" height="196" rx="8" fill="none" stroke="#fff" stroke-opacity=".25"/>

  <!-- Title -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif">
    <text x="214" y="146" font-size="84" font-weight="800" letter-spacing="5" fill="#F1F5F9">BARBERSHOP</text>
    <text x="218" y="202" font-size="26" font-weight="700" letter-spacing="13" fill="#E63946">V1.1 · REMASTERED</text>
    <text x="218" y="248" font-size="19" fill="#9AA7BA" letter-spacing=".5">Full-stack barbershop management · FastAPI · PostgreSQL</text>
  </g>

  <!-- Scissors -->
  <g stroke-linecap="round" fill="none">
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1050 150;-7 1050 150;0 1050 150" dur="2.4s" repeatCount="indefinite"/>
      <line x1="1018" y1="56" x2="1082" y2="238" stroke="#CBD5E1" stroke-width="8"/>
      <circle cx="1090" cy="258" r="20" stroke="#E63946" stroke-width="7"/>
    </g>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0 1050 150;7 1050 150;0 1050 150" dur="2.4s" repeatCount="indefinite"/>
      <line x1="1082" y1="56" x2="1018" y2="238" stroke="#E2E8F0" stroke-width="8"/>
      <circle cx="1010" cy="258" r="20" stroke="#1D5FD1" stroke-width="7"/>
    </g>
    <circle cx="1050" cy="147" r="7" fill="#14213D" stroke="#CBD5E1" stroke-width="3"/>
  </g>
</svg>
